<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#12161b">
<meta name="description" content="Breadboard Lab: learn how a breadboard works by building real circuits.">
<title>Breadboard Lab</title>
<style>/*CSS*/</style>
</head>
<body>
<section id="home" class="screen" hidden>
  <div class="hwrap">
    <div class="hero">
      <div>
        <h1>Breadboard <span>Lab</span></h1>
        <p>Learn how a breadboard works by building real circuits: LEDs, buttons, sensors, Arduino and ESP32.</p>
      </div>
      <svg class="heroart" viewBox="0 0 440 190" aria-hidden="true">
        <rect x="10" y="20" width="420" height="150" rx="12" fill="#f1eee5"/>
        <line x1="30" y1="36" x2="410" y2="36" stroke="#d8322b" stroke-width="2"/><line x1="30" y1="154" x2="410" y2="154" stroke="#2d5fd0" stroke-width="2"/>
        <rect x="10" y="89" width="420" height="12" fill="#ddd7c7"/>
        <g fill="#3b3a36">
          <path d="M40 46h6v6h-6zM56 46h6v6h-6zM72 46h6v6h-6zM88 46h6v6h-6zM104 46h6v6h-6zM120 46h6v6h-6zM136 46h6v6h-6zM152 46h6v6h-6zM168 46h6v6h-6zM184 46h6v6h-6zM200 46h6v6h-6zM216 46h6v6h-6zM232 46h6v6h-6zM248 46h6v6h-6zM264 46h6v6h-6zM280 46h6v6h-6zM296 46h6v6h-6zM312 46h6v6h-6zM328 46h6v6h-6zM344 46h6v6h-6zM360 46h6v6h-6zM376 46h6v6h-6zM392 46h6v6h-6z"/>
          <path d="M40 136h6v6h-6zM56 136h6v6h-6zM72 136h6v6h-6zM88 136h6v6h-6zM104 136h6v6h-6zM120 136h6v6h-6zM136 136h6v6h-6zM152 136h6v6h-6zM168 136h6v6h-6zM184 136h6v6h-6zM200 136h6v6h-6zM216 136h6v6h-6zM232 136h6v6h-6zM248 136h6v6h-6zM264 136h6v6h-6zM280 136h6v6h-6zM296 136h6v6h-6zM312 136h6v6h-6zM328 136h6v6h-6zM344 136h6v6h-6zM360 136h6v6h-6zM376 136h6v6h-6zM392 136h6v6h-6z"/>
        </g>
        <path d="M60 49 Q90 10 140 62" fill="none" stroke="#e0322b" stroke-width="5" stroke-linecap="round"/>
        <rect x="138" y="54" width="54" height="16" rx="7" fill="#e3c79a"/><rect x="148" y="54" width="4" height="16" fill="#f4d21f"/><rect x="156" y="54" width="4" height="16" fill="#7f3fbf"/><rect x="164" y="54" width="4" height="16" fill="#7a4a21"/>
        <circle cx="232" cy="66" r="30" fill="#ff3b2a" opacity=".3" class="fade"/><circle cx="232" cy="66" r="13" fill="#ff3b2a"/><circle cx="228" cy="62" r="5" fill="#fff" opacity=".7"/>
        <path d="M240 72 Q300 140 380 139" fill="none" stroke="#262626" stroke-width="5" stroke-linecap="round"/>
        <rect x="270" y="104" width="120" height="28" rx="3" fill="#0e5aa7"/>
        <g fill="#d4a530"><circle cx="280" cy="110" r="2"/><circle cx="290" cy="110" r="2"/><circle cx="300" cy="110" r="2"/><circle cx="310" cy="110" r="2"/><circle cx="320" cy="110" r="2"/><circle cx="330" cy="110" r="2"/><circle cx="340" cy="110" r="2"/><circle cx="350" cy="110" r="2"/><circle cx="360" cy="110" r="2"/><circle cx="370" cy="110" r="2"/><circle cx="380" cy="110" r="2"/></g>
      </svg>
    </div>
    <div class="secthead"><h2>Levels</h2><span class="mut" id="score"></span></div>
    <div id="levels"></div>
    <button class="sandcard" id="sandboxBtn"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h.01M11 14h.01M15 14h.01"/></svg><span><b>Sandbox</b><span class="mut">A free workbench with every part.</span></span></button>
    <div class="settings">
      <label><input type="checkbox" id="soundHome"> Sound</label>
      <label><input type="checkbox" id="unlockAll"> Unlock all levels</label>
      <button id="resetAll">Reset progress</button>
    </div>
  </div>
</section>
<section id="intro" class="screen" hidden>
  <div class="icardw">
    <div class="inum" id="introNum"></div>
    <h1 id="introTitle"></h1>
    <div id="introPic"></div>
    <p id="introText"></p>
    <p id="introTip" class="mut small"></p>
    <div class="ibtns"><button id="introBack">Levels</button><button id="introGo" class="primary">Start</button></div>
  </div>
</section>
<section id="play" class="screen" hidden>
  <header id="topbar"></header>
  <div class="main">
    <aside id="left"><div id="goal"></div><div id="tray"></div></aside>
    <div id="stage">
      <svg id="bench" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="zoom"></div>
      <div id="banner" class="banner" hidden></div>
    </div>
    <aside id="right"><div id="inspector"></div></aside>
  </div>
  <nav id="tb"></nav>
</section>
<div id="toasts"></div>
<div id="tip" hidden></div>
<div id="loupe" hidden><svg xmlns="http://www.w3.org/2000/svg"><use href="#content"/></svg><span></span></div>
<div id="pop" hidden></div>
<div id="modal" hidden></div>
<script>/*JS*/</script>
</body>
</html>
