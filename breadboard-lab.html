<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#12161b">
<meta name="description" content="Breadboard Lab: learn how a breadboard works by building real circuits.">
<title>Breadboard Lab</title>
<style>:root {
  --bg: #12161b; --panel: #1b2027; --panel2: #232a33; --line: #323b47; --text: #eef2f6; --mut: #9aa6b2;
  --amber: #ffb627; --cyan: #3cc8f5; --good: #3ddc84; --bad: #ff5f57; --warn: #ffb627;
  --mat: #1d2b27; --r: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.on { fill: var(--amber); stroke: var(--amber); }
.mut { color: var(--mut); } .small { font-size: 14px; }
[hidden] { display: none !important; }
.screen { position: fixed; inset: 0; }
.primary { background: var(--amber) !important; color: #1a1300 !important; border-color: transparent !important; font-weight: 700; }
.danger { color: #ffd2cf !important; border-color: #6b2a27 !important; background: #3a1d1c !important; }

/* ---------- home ---------- */
#home { overflow-y: auto; }
.hwrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 40px; }
.hero { display: grid; grid-template-columns: 1fr; gap: 10px; align-items: center; margin-bottom: 18px; }
.hero h1 { margin: 0; font-size: clamp(30px, 6vw, 46px); letter-spacing: -0.02em; line-height: 1.05; }
.hero h1 span { color: var(--amber); }
.hero p { margin: 6px 0 0; color: var(--mut); font-size: 17px; }
.heroart { width: 100%; max-width: 440px; justify-self: center; }
@media (min-width: 760px) { .hero { grid-template-columns: 1.1fr 1fr; } }
.secthead { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 10px; }
.secthead h2 { margin: 0; font-size: 20px; }
#levels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 700px) { #levels { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 980px) { #levels { grid-template-columns: repeat(4, 1fr); } }
.lvl { position: relative; text-align: left; min-height: 112px; padding: 12px; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(160deg, var(--panel2), var(--panel)); display: grid; grid-template-rows: auto 1fr auto; gap: 4px; transition: transform .15s, border-color .15s; }
.lvl:hover { transform: translateY(-2px); border-color: #4a5563; }
.lvl .ln { position: absolute; top: 10px; right: 12px; font-weight: 800; color: #4b5663; font-size: 22px; }
.lvl .lic .ico { width: 28px; height: 28px; color: var(--cyan); }
.lvl.done .lic .ico { color: var(--good); }
.lvl .lt { font-weight: 650; font-size: 15px; line-height: 1.25; }
.lvl .ls .ico { width: 16px; height: 16px; stroke: #4b5663; }
.lvl .ls .ico.on { stroke: var(--amber); }
.lvl.locked { opacity: .45; }
.lvl .lk { position: absolute; bottom: 10px; right: 12px; } .lvl .lk .ico { width: 18px; height: 18px; }
.sandcard { margin-top: 14px; width: 100%; display: flex; gap: 14px; align-items: center; text-align: left; padding: 16px; border-radius: var(--r); border: 1px solid #5a4a1c; background: linear-gradient(120deg, #2b2414, #1b2027 70%); min-height: 72px; }
.sandcard b { font-size: 18px; display: block; } .sandcard .ico { width: 34px; height: 34px; color: var(--amber); }
.settings { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; color: var(--mut); font-size: 15px; }
.settings label { display: flex; gap: 8px; align-items: center; min-height: 44px; cursor: pointer; }
.settings input { width: 22px; height: 22px; accent-color: var(--amber); }
.settings button { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; min-height: 44px; color: var(--mut); }

/* ---------- intro ---------- */
#intro { display: grid; place-items: center; padding: 16px; overflow-y: auto; background: radial-gradient(circle at 50% 0%, #22303a, var(--bg) 70%); }
.icardw { width: 100%; max-width: 620px; text-align: center; }
.inum { color: var(--amber); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; }
.icardw h1 { margin: 4px 0 12px; font-size: clamp(26px, 5vw, 36px); }
.ipic { width: 100%; background: #0e1216; border-radius: 18px; border: 1px solid var(--line); }
#introText { font-size: 19px; margin: 16px auto 20px; max-width: 520px; }
.ibtns { display: flex; gap: 10px; justify-content: center; }
.ibtns button { min-height: 52px; padding: 0 26px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel2); font-size: 18px; }

/* ---------- play ---------- */
#play { display: grid; grid-template-rows: auto 1fr auto; }
#topbar { display: flex; align-items: center; gap: 4px; padding: 4px 6px; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 52px; }
#topbar .ttl { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
.ibtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 0; background: transparent; color: var(--text); }
.ibtn:hover { background: var(--panel2); }
.main { position: relative; display: grid; grid-template-columns: 1fr; min-height: 0; overflow: hidden; overflow: clip; }
#stage { position: relative; min-height: 0; overflow: hidden; touch-action: none;
  background-color: var(--mat);
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 24px 24px; }
#bench { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#zoom { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 3; }
#zoom button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: rgba(27,32,39,.88); display: grid; place-items: center; }
#tb { display: flex; justify-content: space-around; background: var(--panel); border-top: 1px solid var(--line); padding: 4px 4px calc(4px + var(--safe-b)); }
#tb button { flex: 1; max-width: 110px; min-height: 52px; border: 0; background: transparent; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--mut); }
#tb button.on { color: var(--amber); background: #2a2516; }
#tb button.tool.on { color: var(--cyan); background: #14303b; }
body.notray #tb .partsbtn { display: none; }

/* goal card (levels) */
#goal { background: rgba(27,32,39,.95); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.ghead { display: flex; align-items: center; gap: 8px; }
.ghead h2 { margin: 0; font-size: 17px; flex: 1; }
.gnum { color: var(--amber); font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
.steps { margin: 8px 0 4px; padding-left: 22px; }
.steps li { margin: 4px 0; color: var(--mut); }
.steps li.cur { color: var(--text); font-weight: 600; }
.steps .sn { display: none; font-size: 12px; color: var(--amber); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.steps li.done { color: var(--good); text-decoration: line-through; text-decoration-color: rgba(61,220,132,.5); }
.choices { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.choices button { min-height: 46px; padding: 0 20px; border-radius: 12px; border: 1px solid #3c6c80; background: #15303b; font-weight: 650; }
.hint { margin: 6px 0; padding: 8px 10px; border-radius: 10px; background: #2b2616; border: 1px solid #4d421c; font-size: 15px; }
.hintbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #4d421c; background: #221e12; color: #ffd98a; margin-top: 4px; }
.hintbtn .ico { width: 18px; height: 18px; }
.goodtxt { color: #bff5d6; } .goodtxt .ico { width: 18px; height: 18px; vertical-align: -3px; }
#goal > .primary, #goal > button.primary { min-height: 46px; border-radius: 12px; padding: 0 18px; }

/* tray */
#tray { background: var(--panel); }
.trayhead { display: flex; align-items: center; gap: 8px; padding: 4px 2px 8px; }
.trayhead b { font-size: 16px; } .trayhead .closetray { margin-left: auto; }
#tray h4 { margin: 12px 2px 6px; font-size: 13px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.titem { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px 8px; min-height: 96px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); }
.titem:hover { border-color: #56616f; }
.tpic { width: 100%; height: 58px; display: grid; place-items: center; }
.tpic svg { width: 100%; height: 58px; overflow: hidden; display: block; }
.tl { font-size: 12.5px; line-height: 1.2; text-align: center; }

/* inspector */
#inspector { background: var(--panel); }
.ihead { display: flex; align-items: center; } .ihead h3 { margin: 0; flex: 1; font-size: 18px; }
.desc { margin: 4px 0 8px; color: #cfd7df; font-size: 15px; }
.vals .vr { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px dashed #2d3540; font-size: 15px; }
.vals .vr span { color: var(--mut); }
.bigread { font: 700 34px/1.1 ui-monospace, Menlo, Consolas, monospace; padding: 8px 12px; border-radius: 10px; background: #9fae94; color: #182014; text-align: right; }
.bigread small { font-size: 18px; }
.iss { margin: 8px 0; padding: 8px 10px; border-radius: 10px; font-size: 14.5px; }
.iss b { display: block; }
.iss.danger { background: #3a1716; border: 1px solid #7a2c28; } .iss.warn { background: #33280f; border: 1px solid #6b5317; } .iss.info { background: #13303a; border: 1px solid #2c5d6d; }
.ctls { margin-top: 8px; }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; min-height: 48px; border-bottom: 1px solid #262e38; font-size: 15px; }
.ctl > span:first-child { color: var(--mut); }
.ctl select { min-height: 44px; max-width: 62%; border-radius: 10px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); padding: 0 8px; font-size: 15px; }
.ctl input[type=range] { flex: 1 1 140px; min-width: 140px; height: 44px; accent-color: var(--amber); }
.ctl em { font-style: normal; min-width: 76px; text-align: right; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { min-height: 44px; min-width: 52px; border: 0; background: var(--panel2); padding: 0 10px; font-size: 14px; }
.seg button.on { background: var(--amber); color: #1a1300; font-weight: 700; }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; border: 1px solid var(--line); border-radius: 22px; background: var(--panel2); padding: 0 14px 0 6px; }
.toggle i { width: 30px; height: 30px; border-radius: 50%; background: #4a5563; transition: background .15s; }
.toggle.on i { background: var(--good); }
.sw { display: flex; gap: 6px; flex-wrap: wrap; } .sw button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #0006; } .sw button.on { outline: 3px solid var(--cyan); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.acts button { display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); }
.acts button .ico { width: 18px; height: 18px; }
.holdbtn.on { background: #14303b !important; border-color: var(--cyan) !important; }
.roles { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 14.5px; }
.roles th { text-align: left; color: var(--mut); font-weight: 500; }
.roles td, .roles th { padding: 4px 2px; border-bottom: 1px solid #262e38; }
.roles select { min-height: 40px; border-radius: 8px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
.serial { margin-top: 8px; border-radius: 10px; overflow: hidden; border: 1px solid #2c3540; }
.serial .sh { font-size: 12px; color: var(--mut); padding: 4px 8px; background: #161b21; }
.serial pre { margin: 0; padding: 8px; min-height: 48px; max-height: 120px; overflow: auto; background: #0c0f12; color: #8ff0b0; font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
.empty { display: flex; gap: 8px; align-items: flex-start; } .empty .ico { width: 20px; height: 20px; }

/* banner, toasts, tooltip, loupe, popover, modal */
.banner { position: absolute; left: 8px; right: 60px; bottom: 8px; z-index: 4; padding: 10px 12px; border-radius: 12px; font-size: 15px; box-shadow: 0 6px 24px #0008; max-height: 40%; overflow: auto; cursor: pointer; animation: rise .25s ease-out; }
.banner b { display: block; margin-bottom: 2px; }
.banner.danger { background: #3d1513; border: 1px solid #9a3530; }
.banner.warn { background: #3a2c0c; border: 1px solid #8a6a17; }
.banner.info { background: #12323d; border: 1px solid #2f6f82; }
#toasts { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px; width: min(94vw, 460px); pointer-events: none; }
.toast { padding: 10px 14px; border-radius: 12px; font-size: 15px; box-shadow: 0 8px 28px #000a; animation: rise .25s ease-out; transition: opacity .35s, transform .35s; pointer-events: auto; }
.toast.out { opacity: 0; transform: translateY(-8px); }
.toast.good { background: #133d27; border: 1px solid #2f8d57; }
.toast.bad { background: #3d1513; border: 1px solid #9a3530; }
.toast.info { background: #1d2a35; border: 1px solid #3a5468; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
#tip { position: fixed; z-index: 25; pointer-events: none; background: #0e1216ee; border: 1px solid #3a4553; border-radius: 10px; padding: 6px 9px; font-size: 13px; max-width: 220px; }
#tip .vv { color: #ffe08a; font-size: 15px; }
#loupe { position: fixed; z-index: 26; width: 112px; height: 112px; border-radius: 50%; overflow: hidden; border: 3px solid var(--cyan); box-shadow: 0 8px 28px #000c; pointer-events: none; background: var(--mat); }
#loupe svg { width: 100%; height: 100%; display: block; }
#loupe span { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font: 700 12px system-ui; color: #fff; text-shadow: 0 1px 3px #000; }
#loupe::after { content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border: 2px solid #fff; border-radius: 50%; }
.term { background: none; border: 0; padding: 0; color: inherit; font: inherit; border-bottom: 2px dotted var(--cyan); cursor: help; line-height: 1.15; }
#pop { position: fixed; z-index: 40; background: #0e1216; border: 1px solid var(--cyan); border-radius: 12px; padding: 10px 12px; font-size: 15px; box-shadow: 0 8px 30px #000c; }
#pop b { display: block; color: var(--cyan); margin-bottom: 2px; }
#modal { position: fixed; inset: 0; z-index: 50; background: #000a; display: grid; place-items: center; padding: 16px; }
.mbox { width: min(94vw, 440px); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; text-align: center; animation: rise .25s; }
.mbox h2 { margin: 6px 0; }
.mbtns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.mbtns.col { flex-direction: column; }
.mbtns button { min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); }
.bigstars { display: flex; justify-content: center; gap: 6px; }
.bigstars span { animation: pop .5s both; } .bigstars .ico { width: 52px; height: 52px; stroke: #4b5663; }
.bigstars .ico.on { fill: var(--amber); stroke: #c98400; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.15); } }
.learned { font-size: 17px; }

/* ---------- mobile layout: panels become sheets ---------- */
#left, #right { display: contents; }
#goal { position: absolute; left: 8px; right: 60px; top: 8px; z-index: 5; max-height: 34%; overflow: auto; box-shadow: 0 6px 24px #0007; padding: 8px 10px; }
#goal .goodtxt { display: none; }
#goal { font-size: 15px; } #goal .ghead h2 { font-size: 16px; } #goal .ibtn { width: 44px; height: 44px; }
#goal .steps { list-style: none; padding-left: 0; margin: 4px 0; } #goal .steps .sn { display: block; }
#goal .choices button { min-height: 44px; } .hintbtn { min-height: 44px; }
#toasts { top: 58px; }
body.sandmode #goal { display: none; }
#goal .steps li.todo, #goal .steps li.done { display: none; }
body.goalopen #goal .steps li.todo, body.goalopen #goal .steps li.done { display: list-item; }
#tray, #inspector { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; max-height: 56%; overflow-y: auto; padding: 10px 12px 14px; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px #000a; transform: translateY(105%); transition: transform .22s ease-out; }
body.trayopen #tray { transform: none; }
body.hassel #inspector { transform: none; max-height: 36%; }
body.hassel.insfull #inspector { max-height: 72%; }
.insmore { display: flex; width: 100%; justify-content: center; align-items: center; min-height: 44px; margin: 8px 0 0; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--mut); }
body.hassel.trayopen #inspector { transform: translateY(105%); }
#inspector .empty { display: none; }
@media (min-width: 900px) {
  .main { grid-template-columns: 330px 1fr 330px; }
  #left, #right { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 12px; gap: 12px; }
  #right { border-right: 0; border-left: 1px solid var(--line); order: 3; }
  #stage { order: 2; }
  #goal { position: static; max-height: none; box-shadow: none; background: var(--panel2); flex: none; }
  #tray, #inspector { flex: none; }
  #toasts { top: 64px; }
  body.sandmode #goal { display: block; }
  #goal .steps li.todo, #goal .steps li.done { display: list-item; }
  #goal .steps { list-style: decimal; padding-left: 22px; } #goal .steps .sn { display: none; }
  #tray, #inspector { position: static; transform: none !important; max-height: none; box-shadow: none; border: 0; border-radius: 0; padding: 0; overflow: visible; background: transparent; }
  #inspector .empty { display: flex; }
  .closetray, .closeins, .insmore { display: none !important; }
  #tb .partsbtn { display: none; }
  #tb { justify-content: center; gap: 8px; }
  .banner { left: 12px; right: 64px; }
}

/* ---------- SVG: board and parts ---------- */
.bbsign { font: 700 7px system-ui; }
.bblbl { font: 600 4.2px system-ui; fill: #9a9586; }
.bbnum { font: 600 3.8px system-ui; fill: #9a9586; text-anchor: middle; }
.pol { font: 700 6px system-ui; fill: #ffe9a8; }
.pinlbl { font: 600 2.7px system-ui; fill: #fff; }
.pinlbl.dark, .tiny.dark, .chip.dark, .brand.dark { fill: #222; }
.chip { font: 700 3px system-ui; fill: #c9ccd1; }
.tiny { font: 500 2.6px system-ui; fill: #e3e6ea; }
.brand { font: 800 7px system-ui; fill: #fff; } .brand2 { font: 800 5px system-ui; fill: #fff; }
.dmg { font: 800 8px system-ui; fill: #ff5f57; }
.hdr { font: 600 3px system-ui; fill: #ffe9a8; }
.note { font: 600 7px system-ui; fill: #fff; }
.battxt { font: 900 34px system-ui; fill: #f1f1f1; } .battsm { font: 700 8px system-ui; fill: #bbb; letter-spacing: .2em; } .battsm2 { font: 800 10px system-ui; fill: #222; }
.aatxt { font: 700 8px system-ui; fill: #fff; }
.lcd { font: 700 44px ui-monospace, Menlo, Consolas, monospace; fill: #1b221a; } .lcdu { font: 700 12px system-ui; fill: #1b221a; }
.mtrb { font: 800 11px system-ui; fill: #f2bf14; } .mtrl { font: 700 10px system-ui; fill: #e9e9e9; } .mtrs { font: 700 7px system-ui; fill: #bbb; }
.mbs { font: 600 5px system-ui; fill: #e8e8e8; } .mbv { font: 800 7px system-ui; fill: #f2cf1d; } .mbp { font: 800 8px system-ui; fill: #fff; }
.oled { font: 600 8.6px ui-monospace, Menlo, Consolas, monospace; fill: #9fe8ff; } .oledh { fill: #ffe46b; }
.lcdch { font: 700 17px ui-monospace, Menlo, Consolas, monospace; }
.wioscr { font: 600 16px ui-monospace, Menlo, Consolas, monospace; fill: #9fe8ff; }
.capm { font: 800 6px system-ui; fill: #1f2b63; }
.selbox { fill: none; stroke: var(--cyan); stroke-width: 1.2; stroke-dasharray: 4 3; }
.handle { fill: rgba(60,200,245,.25); stroke: var(--cyan); stroke-width: 1; }
.snap { fill: none; stroke: #fff; stroke-width: 1.6; }
.wirestart { fill: rgba(60,200,245,.5); stroke: #fff; stroke-width: 1.2; }
.rubber { fill: none; stroke: var(--cyan); stroke-width: 2.4; stroke-dasharray: 4 3; stroke-linecap: round; }
.hi rect { fill: #ffd54a; stroke: #b98b00; stroke-width: .5; }
.hi circle { fill: none; stroke: #ffd54a; stroke-width: 1.6; }
.hi .me { stroke: #fff; stroke-width: 1.4; }
.issue { fill: none; stroke-width: 2; animation: pulse 1.1s ease-in-out infinite; }

<script>// ---- engine.js ----
// Electrical engine: modified nodal analysis (MNA) with Newton-Raphson for diodes.
// Pure maths, no DOM. Works in the browser (globalThis.BB.engine) and in Node.
(function () {
  'use strict';
  var BB = (globalThis.BB = globalThis.BB || {});

  var VT = 0.025852; // thermal voltage at 300 K
  var GMIN = 1e-12; // tiny leak from every node to its reference, keeps the matrix solvable

  // Element types (all node numbers are 0..n-1):
  //  { t:'R', a, b, r }            resistor
  //  { t:'V', p, n, v }            ideal voltage source (+ at p)
  //  { t:'I', a, b, i }            current source: takes i from node a, pushes it into node b
  //  { t:'D', a, k, is, nvt }      diode / LED junction (anode a, cathode k)
  //  { t:'C', a, b, c, v0 }        capacitor; v0 = voltage a-b at the previous step
  // Results: element current `i` means: R/D/C/I -> from a to b (through the part);
  //          V -> current that leaves the + terminal into the circuit.

  function islands(n, els) {
    var parent = new Int32Array(n);
    for (var i = 0; i < n; i++) parent[i] = i;
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function join(a, b) { a = find(a); b = find(b); if (a !== b) parent[a] = b; }
    els.forEach(function (e) {
      if (e.t === 'V') join(e.p, e.n);
      else if (e.t === 'D') join(e.a, e.k);
      else join(e.a, e.b);
    });
    var id = new Int32Array(n);
    for (var j = 0; j < n; j++) id[j] = find(j);
    return id;
  }

  // Gaussian elimination with partial pivoting. A is n*n row-major, b length n. Solves in place.
  function solveLinear(A, b, n) {
    for (var col = 0; col < n; col++) {
      var piv = col, best = Math.abs(A[col * n + col]);
      for (var r = col + 1; r < n; r++) {
        var v = Math.abs(A[r * n + col]);
        if (v > best) { best = v; piv = r; }
      }
      if (best < 1e-300) continue; // singular column: leave it, variable becomes 0
      if (piv !== col) {
        for (var c = col; c < n; c++) { var t = A[col * n + c]; A[col * n + c] = A[piv * n + c]; A[piv * n + c] = t; }
        var tb = b[col]; b[col] = b[piv]; b[piv] = tb;
      }
      var d = A[col * n + col];
      for (var r2 = col + 1; r2 < n; r2++) {
        var f = A[r2 * n + col] / d;
        if (f === 0) continue;
        for (var c2 = col; c2 < n; c2++) A[r2 * n + c2] -= f * A[col * n + c2];
        b[r2] -= f * b[col];
      }
    }
    var x = new Float64Array(n);
    for (var i = n - 1; i >= 0; i--) {
      var s = b[i];
      for (var k = i + 1; k < n; k++) s -= A[i * n + k] * x[k];
      var dd = A[i * n + i];
      x[i] = Math.abs(dd) < 1e-300 ? 0 : s / dd;
    }
    return x;
  }

  // SPICE-style junction voltage limiting, stops exp() from exploding between iterations.
  function pnjlim(vnew, vold, vt, vcrit) {
    if (vnew > vcrit && Math.abs(vnew - vold) > 2 * vt) {
      if (vold > 0) {
        var arg = 1 + (vnew - vold) / vt;
        vnew = arg > 0 ? vold + vt * Math.log(arg) : vcrit;
      } else {
        vnew = vt * Math.log(vnew / vt);
      }
    }
    return vnew;
  }

  // Diode current and conductance. Above vmax the curve continues as a straight line.
  function diodeIG(vd, is, nvt) {
    var vmax = nvt * 60;
    if (vd > vmax) {
      var em = Math.exp(60);
      var g = (is / nvt) * em;
      return { i: is * (em - 1) + g * (vd - vmax), g: g };
    }
    var e = Math.exp(vd / nvt);
    return { i: is * (e - 1), g: (is / nvt) * e };
  }

  // Solve one operating point.
  // circuit = { n, els, refHints:[node...] }  opts = { dt, init:Float64Array, maxIter }
  function solve(circuit, opts) {
    opts = opts || {};
    var n = circuit.n, els = circuit.els;
    var isl = islands(n, els);
    // Pick one reference (0 V) node for each island: a hint, else a source's minus, else the lowest node.
    var refOf = {};
    (circuit.refHints || []).forEach(function (h) { if (h < n && refOf[isl[h]] === undefined) refOf[isl[h]] = h; });
    els.forEach(function (e) { if (e.t === 'V' && refOf[isl[e.n]] === undefined) refOf[isl[e.n]] = e.n; });
    for (var q = 0; q < n; q++) if (refOf[isl[q]] === undefined) refOf[isl[q]] = q;
    var isRef = new Uint8Array(n);
    Object.keys(refOf).forEach(function (k) { isRef[refOf[k]] = 1; });

    var idx = new Int32Array(n), k = 0;
    for (var i = 0; i < n; i++) idx[i] = isRef[i] ? -1 : k++;
    var nv = k;
    var vsrc = [];
    els.forEach(function (e, j) { if (e.t === 'V') { e._j = nv + vsrc.length; vsrc.push(j); } });
    var size = nv + vsrc.length;

    var diodes = els.filter(function (e) { return e.t === 'D'; });
    var dt = opts.dt;
    var V = new Float64Array(n);
    if (opts.init && opts.init.length === n) V.set(opts.init);
    diodes.forEach(function (d) {
      d._vcrit = d.nvt * Math.log(d.nvt / (Math.SQRT2 * d.is));
      d._vd = V[d.a] - V[d.k];
    });

    function nodeV(x, node) { var j = idx[node]; return j < 0 ? 0 : x[j]; }

    var maxIter = opts.maxIter || 300;
    var x = new Float64Array(size), converged = false, iter = 0;
    for (iter = 1; iter <= maxIter; iter++) {
      var A = new Float64Array(size * size), b = new Float64Array(size);
      var addG = function (a, bb, g) {
        var ia = idx[a], ib = idx[bb];
        if (ia >= 0) A[ia * size + ia] += g;
        if (ib >= 0) A[ib * size + ib] += g;
        if (ia >= 0 && ib >= 0) { A[ia * size + ib] -= g; A[ib * size + ia] -= g; }
      };
      var addI = function (node, cur) { var j = idx[node]; if (j >= 0) b[j] += cur; }; // current pushed into node
      for (var m = 0; m < n; m++) if (idx[m] >= 0) A[idx[m] * size + idx[m]] += GMIN;
      for (var e = 0; e < els.length; e++) {
        var el = els[e];
        switch (el.t) {
          case 'R': addG(el.a, el.b, 1 / el.r); break;
          case 'I': addI(el.a, -el.i); addI(el.b, el.i); break;
          case 'V': {
            var r = el._j, ip = idx[el.p], ineg = idx[el.n];
            if (ip >= 0) { A[ip * size + r] += 1; A[r * size + ip] += 1; }
            if (ineg >= 0) { A[ineg * size + r] -= 1; A[r * size + ineg] -= 1; }
            b[r] += el.v;
            break;
          }
          case 'C': {
            if (!dt) break; // DC: a capacitor is an open circuit
            var gc = el.c / dt;
            addG(el.a, el.b, gc);
            addI(el.a, gc * (el.v0 || 0)); addI(el.b, -gc * (el.v0 || 0));
            break;
          }
          case 'D': {
            var ig = diodeIG(el._vd, el.is, el.nvt);
            var gd = ig.g + GMIN;
            var ieq = ig.i - ig.g * el._vd;
            addG(el.a, el.k, gd);
            addI(el.a, -ieq); addI(el.k, ieq);
            break;
          }
        }
      }
      var xn = solveLinear(A, b, size);
      // Convergence: node voltages stop moving and every junction voltage matches its limited value.
      var maxdv = 0;
      for (var s = 0; s < nv; s++) maxdv = Math.max(maxdv, Math.abs(xn[s] - x[s]) / (1 + Math.abs(xn[s])));
      var limited = false;
      for (var di = 0; di < diodes.length; di++) {
        var d = diodes[di];
        var vnew = nodeV(xn, d.a) - nodeV(xn, d.k);
        var vlim = pnjlim(vnew, d._vd, d.nvt, d._vcrit);
        if (Math.abs(vlim - vnew) > 1e-12) limited = true;
        maxdv = Math.max(maxdv, Math.abs(vlim - d._vd));
        d._vd = vlim;
      }
      x = xn;
      if (iter > 1 && !limited && maxdv < 1e-8) { converged = true; break; }
      if (diodes.length === 0) { converged = true; break; }
    }

    for (var z = 0; z < n; z++) V[z] = nodeV(x, z);
    var I = new Float64Array(els.length);
    var capV = {};
    els.forEach(function (el, j) {
      switch (el.t) {
        case 'R': I[j] = (V[el.a] - V[el.b]) / el.r; break;
        case 'I': I[j] = el.i; break;
        case 'V': I[j] = -x[el._j]; break;
        case 'D': I[j] = diodeIG(V[el.a] - V[el.k], el.is, el.nvt).i; break;
        case 'C': {
          var vc = V[el.a] - V[el.b];
          I[j] = dt ? (el.c / dt) * (vc - (el.v0 || 0)) : 0;
          capV[j] = vc;
          break;
        }
      }
    });
    return { v: V, i: I, converged: converged, iterations: iter, island: isl, refOf: refOf, capV: capV };
  }

  // LED / diode parameters. Each colour has a forward voltage at 20 mA (vf20) that includes
  // the drop across its internal series resistance rs.
  var LED_TYPES = {
    red:    { vf20: 2.0, rs: 10, nm: 630, rgb: '#ff2a1a', label: 'Red' },
    orange: { vf20: 2.05, rs: 10, nm: 605, rgb: '#ff8a1a', label: 'Orange' },
    yellow: { vf20: 2.1, rs: 10, nm: 590, rgb: '#ffd21a', label: 'Yellow' },
    green:  { vf20: 2.2, rs: 10, nm: 570, rgb: '#3dff3a', label: 'Green' },
    blue:   { vf20: 3.0, rs: 12, nm: 470, rgb: '#2a7bff', label: 'Blue' },
    white:  { vf20: 3.1, rs: 12, nm: 0, rgb: '#f4f7ff', label: 'White' }
  };
  var LED_N = 2.0; // ideality factor typical for LEDs
  function ledParams(color) {
    var p = LED_TYPES[color] || LED_TYPES.red;
    var nvt = LED_N * VT;
    var vj = p.vf20 - 0.02 * p.rs; // junction voltage at 20 mA
    return { is: 0.02 / Math.exp(vj / nvt), nvt: nvt, rs: p.rs, vf20: p.vf20 };
  }
  // Forward voltage of an LED at a given current (used in explanations and tests).
  function ledVf(color, iA) {
    var p = ledParams(color);
    return p.nvt * Math.log(iA / p.is + 1) + iA * p.rs;
  }

  BB.engine = {
    solve: solve,

        var locked = (p.locked && !pr.env && ['top', 'bottom', 'on', 'mode', 'pos', 'usb'].indexOf(pr.k) < 0) || lock.indexOf(pr.k) >= 0;
        if (pr.k === 'pcb' || pr.k === 'shell') locked = false;
        var v = p.props[pr.k];
        ctrls += '<label class="ctl"><span>' + esc(pr.label) + '</span>';
        if (locked) ctrls += '<b>' + esc(pr.labels ? pr.labels[pr.options.indexOf(v)] : (pr.fmt ? pr.fmt(v) : v)) + '</b>';
        else if (pr.type === 'select') ctrls += '<select data-k="' + pr.k + '">' + pr.options.map(function (o, i) { return '<option value="' + i + '"' + (o === v ? ' selected' : '') + '>' + esc(pr.labels ? pr.labels[i] : o) + '</option>'; }).join('') + '</select>';
        else if (pr.type === 'seg') ctrls += '<span class="seg">' + pr.options.map(function (o, i) { return '<button data-k="' + pr.k + '" data-v="' + i + '" class="' + (o === v ? 'on' : '') + '">' + esc(pr.labels[i]) + '</button>'; }).join('') + '</span>';
        else if (pr.type === 'toggle') ctrls += '<button class="toggle' + (v ? ' on' : '') + '" data-k="' + pr.k + '" data-t="1"><i></i>' + (v ? 'On' : 'Off') + '</button>';
        else if (pr.type === 'range') ctrls += '<input type="range" data-k="' + pr.k + '" min="' + pr.min + '" max="' + pr.max + '" step="' + pr.step + '" value="' + v + '"><em data-out="' + pr.k + '">' + esc(pr.fmt ? pr.fmt(v) : v) + '</em>';
        else if (pr.type === 'swatch') ctrls += '<span class="sw">' + pr.options.map(function (o) { return '<button data-k="' + pr.k + '" data-s="' + o + '" style="background:' + BB.WIRE_RGB[o] + '" class="' + (o === v ? 'on' : '') + '" title="' + o + '"></button>'; }).join('') + '</span>';
        ctrls += '</label>';
      });
      if (def.mcu) ctrls += this.programUi(p, lock.indexOf('program') >= 0);
      html += '<div class="ctls">' + ctrls + '</div>';
      var acts = '';
      if (p.type === 'button') acts += '<button class="holdbtn" data-a="hold">Hold to press</button>';
      (def.actions || []).forEach(function (a) { acts += '<button data-a="' + a.id + '">' + esc(a.label) + '</button>'; });
      if ((def.kind === 'leads' || def.kind === 'module') && p.ends.length === 2 && !p.locked && p.type !== 'wire') acts += '<button data-a="flip">' + icon('flip') + ' Flip</button>';
      if (def.kind === 'rigid' && !def.noRotate && !p.locked) acts += '<button data-a="rotate">' + icon('rotate') + ' Rotate</button>';
      if (p.st.burnt || (p.st.burntSeg && Object.keys(p.st.burntSeg).length)) acts += '<button class="primary" data-a="renew">New ' + (p.type === 'led' ? 'LED' : 'part') + '</button>';
      if (def.mcu && p.st.damaged && Object.keys(p.st.damaged).length) acts += '<button class="primary" data-a="renew">New board</button>';
      if (p.type === 'meter' && p.st.fuse) acts += '<button class="primary" data-a="fuse">New fuse</button>';
      if (!p.locked) acts += '<button class="danger" data-a="del">' + icon('trash') + ' Delete</button>';
      html += '<div class="acts">' + acts + '</div>';
      ins.innerHTML = html;
      this.refreshInspector();
      var setProp = function (k, v) { var u = self.snapshot(); p.props[k] = v; self.sim.dirty(); self.commit(u); self.bench.render(); self.onInteract('prop', p); };
      ins.onchange = function (e) {
        var t = e.target, k = t.dataset.k; if (!k) return;
        var pr = (def.props || []).find(function (q) { return q.k === k; });
        if (t.tagName === 'SELECT' && pr) { setProp(k, pr.options[+t.value]); self.onSelect(id); }
        if (t.dataset.prog) { setProp('program', t.value); self.onSelect(id); }
        if (t.dataset.role) { var u = self.snapshot(); p.props.pins = Object.assign({}, p.props.pins || {}); p.props.pins[t.dataset.role] = t.value; self.commit(u); self.sim.dirty(); }
      };
      ins.oninput = function (e) {
        var t = e.target, k = t.dataset.k; if (!k || t.type !== 'range') return;
        var pr = def.props.find(function (q) { return q.k === k; });

        var out = ins.querySelector('[data-out="' + k + '"]'); if (out) out.textContent = pr.fmt ? pr.fmt(+t.value) : t.value;
      };
      ins.onclick = function (e) {

        if (k && b.dataset.v !== undefined) { var pr = def.props.find(function (q) { return q.k === k; }); setProp(k, pr.options[+b.dataset.v]); self.onSelect(id); return; }
        if (k && b.dataset.t) { setProp(k, !p.props[k]); self.onSelect(id); return; }
        if (k && b.dataset.s) { setProp(k, b.dataset.s); self.onSelect(id); return; }
        var a = b.dataset.a;
        if (a === 'del') self.removePart(p.id, true);
        if (a === 'flip') { var u = self.snapshot(); p.ends.reverse(); self.sim.dirty(); self.commit(u); self.bench.render(); self.onInteract('moved', p); }
        if (a === 'rotate') { self.rotatePart(p); }
        if (a === 'renew') { var u2 = self.snapshot(); p.st = {}; self.sim.dirty(); self.commit(u2); self.bench.render(true); self.onSelect(id); }
        if (a === 'fuse') { p.st.fuse = false; self.sim.dirty(); self.onSelect(id); }
        if (a === 'clap' || a === 'wave') self.partAction(p, a);

      };
      var hold = ins.querySelector('.holdbtn');
      if (hold) {
        var down = function (e) { e.preventDefault(); p.st.pressed = true; self.sim.dirty(); self.onInteract('press', p); hold.classList.add('on'); self.bench.render(); };
        var upf = function () { if (!p.st.pressed) return; p.st.pressed = false; self.sim.dirty(); self.onInteract('release', p); hold.classList.remove('on'); self.bench.render(); };
        hold.addEventListener('pointerdown', down); hold.addEventListener('pointerup', upf); hold.addEventListener('pointerleave', upf); hold.addEventListener('pointercancel', upf);
      }
    },
    programUi: function (p, locked) {
      var def = PARTS[p.type], mcu = def.mcu, P = BB.programs;
      var cur = p.props.program || 'none';

      if (locked) s += '<b>' + esc(P.P[cur].name) + '</b>';
      else s += '<select data-prog="1">' + P.ORDER.filter(function (id) { return P.available(mcu, id); }).map(function (id) { return '<option value="' + id + '"' + (id === cur ? ' selected' : '') + '>' + esc(P.P[id].name) + '</option>'; }).join('') + '</select>';
      s += '</label>';
      var prog = P.P[cur];
      s += '<p class="small">' + esc(prog.desc) + '</p>';
      if (mcu === 'pi5') s += '<p class="small mut">The Raspberry Pi has no analog inputs, so knob, light and sound programs are not offered.</p>';
      var roles = Object.keys(prog.roles);
      if (roles.length) {
        var gp = def.pins.filter(function (q) { return q.kind === 'gpio'; });
        s += '<table class="roles"><tr><th>Use</th><th>Pin</th></tr>' + roles.map(function (r) {
          var pin = P.pinFor(p, r);
          var cell = (this.mode === 'sandbox')
            ? '<select data-role="' + r + '">' + gp.filter(function (q) { return !prog.roles[r].analog || q.analog; }).filter(function (q) { return prog.roles[r].mode !== 'out' || !q.inputOnly; }).map(function (q) { return '<option' + (q.n === pin ? ' selected' : '') + '>' + esc(q.n) + '</option>'; }).join('') + '</select>'
            : '<b>' + esc(pin) + (def.pins.find(function (q) { return q.n === pin; }).phys ? ' (pin ' + def.pins.find(function (q) { return q.n === pin; }).phys + ')' : '') + '</b>';
          return '<tr><td>' + esc(prog.roles[r].label) + '</td><td>' + cell + '</td></tr>';
        }, this).join('') + '</table>';
      }
      s += '<div class="serial"><div class="sh">Serial monitor</div><pre id="serial"></pre></div>';
      return s;
    },
    refreshInspector: function () {
      var id = this.bench.sel; if (!id || !this.sim.res) return;
      var p = this.sim.part(id); if (!p) return;
      var def = PARTS[p.type], vals = $('#vals'); if (!vals) return;
      var r = this.sim.res, keys = (r.nets.keys || {})[p.id] || [];
      var rr = { pinV: function (k) { var v = r.keyV[keys[k]]; return v === undefined ? 0 : v; } };
      var rows = def.info ? def.info(p, rr) : [];
      var issues = r.issues.filter(function (is) { return is.part === p.id; });
      var html = rows.map(function (row) { return '<div class="vr"><span>' + esc(row[0]) + '</span><b>' + esc(row[1]) + '</b></div>'; }).join('');
      if (p.type === 'meter') html = '<div class="bigread">' + esc((p.st.reading && p.st.reading.text) || '—') + ' <small>' + esc((p.st.reading && p.st.reading.unit) || '') + '</small></div>';
      if (issues.length) html += issues.map(function (is) { return '<div class="iss ' + is.level + '"><b>' + esc(is.title) + '</b>' + rich(is.text) + '</div>'; }).join('');
      if (vals.innerHTML !== html) vals.innerHTML = html;
      var ser = $('#serial');
      if (ser) { var t = (p.st.serial || []).join('\n') || (p.st.powered ? '' : '(no power)'); if (ser.textContent !== t) ser.textContent = t; }
      var pos = document.querySelector('#inspector input[data-k=pos]');
      if (pos && document.activeElement !== pos && +pos.value !== p.props.pos) { pos.value = p.props.pos; var o = document.querySelector('#inspector [data-out=pos]'); if (o) o.textContent = Math.round(p.props.pos * 100) + ' %'; }
    },
    rotatePart: function (p) {
      var u = this.snapshot(), sim = this.sim, def = PARTS[p.type];
      var old = p.rot || 0;
      p.rot = (old + 90) % 360;
      // keep it plugged in if the rotated pins fit, else lift it off the board
      var pts = sim.pinPoints(p), occ = sim.occupancy(), cov = sim.covered();
      var ok = !p.free && pts.every(function (q) { return q.at && (!occ[q.at] || occ[q.at].id === p.id) && (!cov[q.at] || cov[q.at] === p.id); });
      if (!ok) {
        var found = false;
        for (var dx = -2; dx <= 2 && !found; dx++) for (var dy = -3; dy <= 3 && !found; dy++) {
          var x0 = Math.round(p.x) + dx, y0 = Math.round(p.y) + dy;
          var good = def.pinPos.every(function (q) { var r = BB.rotate(q[0], q[1], p.rot), h = sim.board.holeAt(x0 + r[0], y0 + r[1]); return h && h.x === x0 + r[0] && h.y === y0 + r[1] && (!occ[h.id] || occ[h.id].id === p.id) && (!cov[h.id] || cov[h.id] === p.id); });
          if (good) { p.x = x0; p.y = y0; p.free = false; found = true; }

      }
      sim.dirty(); this.commit(u); this.bench.render(); this.onInteract('moved', p);
    },
    partAction: function (p, a) {
      if (a === 'clap') { p.st.clapUntil = this.sim.t + 1.2; audio.noise(0.12, 0.25); }
      if (a === 'wave') { p.st.motionUntil = this.sim.t + 4; }
      this.sim.dirty();
    },
    onInteract: function (what, p) { if (this.mode === 'level') this.checkLevel(); this.saveSandbox(); },

    // ---------- the action API (used by tests and level setups) ----------
    actions: function () {
      var self = this;
      var id = function (x) { return typeof x === 'string' ? x : x.id; };
      var A = {
        add: function (type, init) { var p = BB.newPart(type, init || {}); self.sim.state.parts.push(p); self.sim.dirty(); if (self.bench.sim === self.sim) self.bench.render(); return p; },
        wire: function (a, b) { return self.addWire(a, b); },
        del: function (x) { self.removePart(id(x)); },
        flip: function (x) { var p = self.sim.part(id(x)); p.ends.reverse(); self.sim.dirty(); },
        moveEnd: function (x, k, at) { var p = self.sim.part(id(x)); p.ends[k] = { at: at }; self.sim.dirty(); },
        move: function (x, px, py, rot) { var p = self.sim.part(id(x)); p.x = px; p.y = py; if (rot !== undefined) p.rot = rot; p.free = false; self.sim.dirty(); },
        set: function (x, k, v) { var p = self.sim.part(id(x)); p.props[k] = v; self.sim.dirty(); self.onInteract('prop', p); },
        press: function (x, on) { var p = self.sim.part(id(x)); p.st.pressed = on; self.sim.dirty(); },
        action: function (x, a) { self.partAction(self.sim.part(id(x)), a); },
        tap: function (h) { self.bench.hiHole = h; self.onTapHole(h); },
        xray: function (on) { self.setXray(on); self.checkLevel(); },
        choose: function (i) { self.choose(i); },
        wait: function (sec) { for (var t = 0; t < sec; t += 1 / 60) { self.sim.step(1 / 60); self.afterStep(); } },
        find: function (t) { return self.sim.state.parts.filter(function (p) { return p.type === t; }); }
      };
      return A;
    },

    // ---------- each frame ----------
    frame: function (dt) {
      if (!this.sim || $('#play').hidden) return;
      if (this.sim.isDynamic()) { this.sim.step(dt); this.afterStep(); }
      if (this.sim.ver !== this._drawnVer) { this._drawnVer = this.sim.ver; this.bench.render(); }
      var now = performance.now();
      if (!this._insT || now - this._insT > 200) { this._insT = now; this.refreshInspector(); this.updateBanner(); if (this.mode === 'level') this.checkLevel(); }
    },
    afterStep: function () {
      var sim = this.sim, self = this;
      // events: burns, fuses, damage
      sim.events.forEach(function (ev) {
        if (ev.type === 'burn') { audio.noise(0.25, 0.35); audio.blip(140, 0.3, 'sawtooth', 0.05, 60); if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) { /* ignore */ } }
        if (ev.type === 'fuse') { audio.blip(1800, 0.05, 'square', 0.05); audio.noise(0.06, 0.2); }
        if (ev.type === 'damage') { audio.noise(0.3, 0.3); }
        if (self.mode === 'level' && self.level && !self.level.done) self.level.mistakes++;
        if (self.bench.sel === ev.part) self.onSelect(ev.part);
      });
      sim.events = [];
      if (this.mode === 'level' && this.level && !this.level.done) {
        var lv = this.level;
        sim.res.issues.forEach(function (is) {
          if (is.kind === 'short' && !lv.baseline.short && !lv.issueSeen.short) { lv.issueSeen.short = true; lv.mistakes++; }
        });
        if (!sim.res.issues.some(function (is) { return is.kind === 'short'; })) { lv.issueSeen.short = false; lv.baseline.short = false; }
        this.checkLevel();
      }
      // sound from buzzers and speakers

      sim.state.parts.forEach(function (p) {
        if (p.type === 'buzzer' && p.st.sound) want[p.id] = { f: p.st.sound.f, vol: p.st.sound.vol };
        if (p.type === 'speaker' && Math.abs(p._i || 0) > 0.002) {
          var f = 0;
          sim.state.parts.forEach(function (q) { var io = q.st && q.st.io; if (io) Object.keys(io).forEach(function (k) { if (io[k].freq) f = io[k].freq; }); });

        }

      audio.tones(want);
    },
    // The banner above the bench explains the most important problem.
    updateBanner: function () {
      var sim = this.sim, ban = $('#banner'); if (!sim || !sim.res) return;
      var iss = sim.res.issues.slice().sort(function (a, b) { return (a.level === 'danger' ? 0 : 1) - (b.level === 'danger' ? 0 : 1); });
      var msg = null;
      if (iss.length) msg = { level: iss[0].level, title: iss[0].title, text: iss[0].text };

    // ---------- small UI pieces ----------

  // little tray pictures: draw the real part art, scaled into a box
